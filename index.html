<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diwali Expense Tracker</title>
    <style>
      :root { --primary:#f59e0b; --card-bg:rgba(255,255,255,0.92); --text:#1f2937; }
      *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
      body{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#31103f 100%);color:var(--text);margin:0;padding:16px;min-height:100vh;display:flex;justify-content:center;align-items:center;}
      .container{width:100%;max-width:480px;background:var(--card-bg);border-radius:20px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,0.4);border:1px solid rgba(251,191,36,0.3)}
      h2{margin:0 0 4px;color:#78350f;text-align:center;font-size:1.3rem}
      .quote-box{background:#fef3c7;border-left:4px solid #d97706;padding:10px;border-radius:0 8px 8px 0;font-style:italic;text-align:center;margin-bottom:12px}
      .form-group{margin-bottom:12px}label{display:block;margin-bottom:6px;font-weight:600;color:#4b5563}
      input, select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
      .amount-wrapper{display:flex;gap:8px}.amount-wrapper input{flex:2}.amount-wrapper select{flex:1}
      button{width:100%;padding:12px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer}
      .success-box{display:none;background:#ecfdf5;border:1px solid #6ee7b7;padding:14px;border-radius:10px;text-align:center;margin-top:10px}
      .btn-secondary{display:inline-block;padding:8px 12px;background:#059669;color:#fff;border-radius:8px;text-decoration:none}
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Diwali Celebration Tracker</h2>
      <div class="quote-box" id="quoteDisplay">"May the divine light of Diwali spread into your life peace, prosperity, happiness and good health."</div>

      <form id="expenseForm">
        <div class="form-group">
          <label for="personName">Your Name</label>
          <input id="personName" name="personName" required placeholder="e.g. Bhanu">
        </div>

        <div class="form-group">
          <label for="expenseType">Expense Description</label>
          <input id="expenseType" name="expenseType" required placeholder="e.g. Fireworks, Hall, Sweets">
        </div>

        <div class="form-group">
          <label for="amount">Amount & Currency</label>
          <div class="amount-wrapper">
            <input id="amount" name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00">
            <select id="currency" name="currency">
              <option value="EUR">EUR</option>
              <option value="CHF">CHF</option>
            </select>
          </div>
        </div>

        <button id="submitBtn" type="submit">Submit Expense</button>
      </form>

      <div id="successBox" class="success-box">
        <p>🎉 Expense recorded successfully!</p>
        <a id="sheetLink" class="btn-secondary" target="_blank" href="#">View Sheet</a>
        <div style="margin-top:8px"><button onclick="resetForm()" style="padding:8px 12px;border-radius:8px;border:1px solid #059669;background:transparent;color:#059669;cursor:pointer">+ Add Another</button></div>
      </div>
    </div>

    <script>
      // Replace with your Apps Script /exec URL (you already supplied this)
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxJB0j14Mu3l-dGFUyVy9nA30O427gxf8R4n-Ul1AUUl-65Qpi4_HzLlDKvl18vLLrBg/exec";
      const SHEET_URL = "https://docs.google.com/spreadsheets/d/1uiulhB6XOlG8Pml0-p2wp_NWjHKvfZWTcG1rSbWQzkA/edit";

      // small quote rotation
      (function() {
        const q = [
          "May the divine light of Diwali spread into your life peace, prosperity, happiness and good health.",
          "Rejoice on this blessed occasion as Lord Rama returns home, filling our hearts with boundless devotion and joy.",
          "Let each diya you light bring a new ray of hope, unity, and abundance to our community celebration."
        ];
        const el = document.getElementById('quoteDisplay');
        if (el) el.innerText = q[Math.floor(Math.random()*q.length)];
      })();

      function resetForm(){
        document.getElementById('expenseForm').reset();
        document.getElementById('expenseForm').style.display = 'block';
        document.getElementById('successBox').style.display = 'none';
      }

      document.getElementById('expenseForm').addEventListener('submit', function(e){
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Recording...';

        // Build and submit a real HTML form so the request is a normal POST (application/x-www-form-urlencoded).
        // This is the most reliable approach inside restrictive in-app browsers (WhatsApp).
        const fd = new FormData(this);
        const tempForm = document.createElement('form');
        tempForm.method = 'POST';
        tempForm.action = SCRIPT_URL;
        tempForm.target = '_blank'; // open external tab if in-app browser blocks navigation

        for (const [k,v] of fd.entries()) {
          const inp = document.createElement('input');
          inp.type = 'hidden';
          inp.name = k;
          inp.value = v;
          tempForm.appendChild(inp);
        }
        document.body.appendChild(tempForm);
        try {
          tempForm.submit(); // normal POST navigation (opens new tab/window)
          // assume success (Apps Script will append). Show UI immediately.
          document.getElementById('expenseForm').style.display = 'none';
          document.getElementById('sheetLink').href = SHEET_URL;
          document.getElementById('successBox').style.display = 'block';
        } catch (err) {
          alert('Submission failed inside the in-app browser. Try "Open in Browser" from WhatsApp or use the link opened.');
          console.error(err);
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Submit Expense';
          tempForm.remove();
        }
      });
    </script>
  </body>
</html>
