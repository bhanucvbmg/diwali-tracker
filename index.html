<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxJB0j14Mu3l-dGFUyVy9nA30O427gxf8R4n-Ul1AUUl-65Qpi4_HzLlDKvl18vLLrBg/exec"; // paste the web app URL

  // rotate quote (keep your existing quotes if desired)
  const quotes = [
    "\"May the divine light of Diwali spread into your life peace, prosperity, happiness and good health.\"",
    "\"Rejoice on this blessed occasion as Lord Rama returns home, filling our hearts with boundless devotion and joy.\"",
    "\"Let each diya you light bring a new ray of hope, unity, and abundance to our community celebration.\""
  ];
  document.getElementById('quoteDisplay').innerText = quotes[Math.floor(Math.random() * quotes.length)];

  document.getElementById('expenseForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "Recording...";

    // Use FormData -> URLSearchParams to send application/x-www-form-urlencoded (simple request, avoids preflight)
    const formData = new FormData(this);
    const params = new URLSearchParams();
    for (const pair of formData.entries()) {
      params.append(pair[0], pair[1]);
    }

    // Use no-cors to avoid strict CORS/preflight issues in in-app browsers.
    // Note: response will be opaque (we can't read it). We assume success if fetch completes.
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        // Do NOT set 'Content-Type' manually to application/json (that triggers preflight).
        // When mode: 'no-cors' the browser may ignore custom headers; using URLSearchParams is safe.
      },
      body: params.toString()
    })
    .then(() => {
      // We can't inspect the response in no-cors mode; assume success
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Expense";
      document.getElementById('expenseForm').style.display = 'none';
      document.getElementById('sheetLink').href = SCRIPT_URL.replace(/\/exec.*$/, '/edit'); // optional placeholder
      document.getElementById('successBox').style.display = 'block';
    })
    .catch((err) => {
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Expense";
      alert("Error saving expense. Please try again.");
      console.error(err);
    });
  });

  function resetForm() {
    document.getElementById('expenseForm').reset();
    document.getElementById('expenseForm').style.display = 'block';
    document.getElementById('successBox').style.display = 'none';
  }
</script>
