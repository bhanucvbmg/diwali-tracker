<!DOCTYPE html>
<html>
  <head>
    <base target="_blank">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diwali Expense Tracker - Nov 7, 2026</title>
    <style>
      :root {
        --primary: #f59e0b;
        --primary-hover: #d97706;
        --bg-dark: #0f172a;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text: #1f2937;
      }
      * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      body {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31103f 100%);
        color: var(--text);
        margin: 0;
        padding: 16px 12px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        width: 100%;
        max-width: 480px;
        background: var(--card-bg);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(251, 191, 36, 0.3);
      }
      .header-art { text-align: center; margin-bottom: 12px; }
      .diya-icon { font-size: 2.2rem; display: inline-block; }
      h2 { margin: 0 0 4px 0; color: #78350f; text-align: center; font-size: 1.5rem; }
      .event-date { text-align: center; font-size: 0.85rem; color: #92400e; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
      .quote-box { background: #fef3c7; border-left: 4px solid #d97706; padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 0.85rem; font-style: italic; color: #78350f; margin-bottom: 18px; text-align: center; }
      .form-group { margin-bottom: 16px; }
      label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #4b5563; }
      input, select { width: 100%; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; outline: none; background: #fff; }
      .amount-wrapper { display: flex; gap: 8px; }
      .amount-wrapper input { flex: 2; }
      .amount-wrapper select { flex: 1; }
      button { width: 100%; padding: 13px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3); }
      button:disabled { background: #9ca3af; }
      .success-box { display: none; background-color: #ecfdf5; border: 1px solid #6ee7b7; border-radius: 12px; padding: 18px; text-align: center; margin-top: 10px; }
      .success-box p { color: #065f46; margin: 0 0 14px 0; font-weight: 600; }
      .btn-secondary { display: inline-block; text-decoration: none; background-color: #059669; color: white; padding: 11px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; }
      .btn-add-more { background-color: transparent; color: #059669; border: 1px solid #059669; margin-top: 10px; padding: 9px 16px; width: 100%; font-weight: 600; border-radius: 8px; cursor: pointer;}
      .divine-footer { text-align: center; margin-top: 16px; font-size: 0.78rem; color: #6b7280; border-top: 1px dashed #e5e7eb; padding-top: 10px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-art">
        <span class="diya-icon">🪔</span>
        <h2>Diwali Celebration Tracker</h2>
        <div class="event-date">✨ November 7, 2026 ✨</div>
      </div>

      <div class="quote-box">
        "May the divine light of Diwali spread into your life peace, prosperity, happiness and good health."
      </div>
      
      <form id="expenseForm">
        <div class="form-group">
          <label for="personName">Your Name</label>
          <input type="text" id="personName" name="personName" placeholder="e.g. Bhanu" required>
        </div>

        <div class="form-group">
          <label for="expenseType">Expense Description</label>
          <input type="text" id="expenseType" name="expenseType" placeholder="e.g. Fireworks, Hall, Sweets" required>
        </div>

        <div class="form-group">
          <label for="amount">Amount & Currency</label>
          <div class="amount-wrapper">
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="0.00" required>
            <select id="currency" name="currency">
              <option value="CHF">CHF</option>
              <option value="EUR">EUR</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submitBtn">Submit Expense</button>
      </form>

      <div id="successBox" class="success-box">
        <p>🎉 Expense recorded successfully!</p>
        <a id="sheetLink" href="https://docs.google.com/spreadsheets/d/1uiulhB6XOlG8Pml0-p2wp_NWjHKvfZWTcG1rSbWQzkA/edit" target="_blank" class="btn-secondary">📊 View Existing Expenses in Sheet</a>
        <button type="button" class="btn-add-more" onclick="resetForm()">+ Add Another Expense</button>
      </div>

      <div class="divine-footer">
        🙏 Sri Rama, Seetha, Lakshmana & Hanuma Samethaaya Namaha 🙏
      </div>
    </div>

    <script>
      // REPLACE THIS with your actual Google Apps Script Web App URL ending in /exec
      const SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

      document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Recording...";

        const formData = {
          personName: document.getElementById('personName').value,
          expenseType: document.getElementById('expenseType').value,
          amount: document.getElementById('amount').value,
          currency: document.getElementById('currency').value
        };

        // Send data to Google Apps Script via POST request
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Bypasses CORS restrictions from static pages
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        })
        .then(() => {
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit Expense";
          document.getElementById('expenseForm').style.display = 'none';
          document.getElementById('successBox').style.display = 'block';
        })
        .catch(error => {
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit Expense";
          alert("Error saving expense. Please try again.");
          console.error(error);
        });
      });

      function resetForm() {
        document.getElementById('expenseForm').reset();
        document.getElementById('expenseForm').style.display = 'block';
        document.getElementById('successBox').style.display = 'none';
      }
    </script>
  </body>
</html>
